{% extends "base_generic.html" %}

{% block content %}
<h2 class="section-title">📸 Galerie – {{ tournament.name }}</h2>

<form method="POST" enctype="multipart/form-data" style="margin-bottom: 2rem;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="upload-button">Envoyer une photo</button>
</form>

<div class="gallery-grid">
  {% for photo in photos %}
    <div class="gallery-item">
      <img src="{{ photo.image.url }}" alt="{{ photo.title }}">
      <div class="caption">{{ photo.title }}</div>
    </div>
  {% empty %}
    <p>Aucune photo pour ce tournoi.</p>
  {% endfor %}
</div>

<style>
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
}

.gallery-item img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}

.caption {
  text-align: center;
  padding: 5px;
  font-size: 0.9rem;
}

.upload-button {
  padding: 10px 20px;
  background-color: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
{% endblock %}
