{% extends "base_generic.html" %}

{% block content %}
<h2 class="section-title">📸 Galerie – {{ tournament.name }}</h2>

<!-- Formulaire d'ajout de photo -->
<form method="POST" enctype="multipart/form-data" style="margin-bottom: 2rem;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="upload-button">📤 Envoyer une photo</button>
</form>

<!-- Galerie -->
<div class="gallery-grid">
  {% for photo in photos %}
    <div class="gallery-item">
      <img src="{{ photo.image.url }}" alt="{{ photo.title }}">
      <div class="caption">{{ photo.title }}</div>

      <!-- Bouton de suppression -->
      <form method="POST" action="{% url 'delete_tournament_photo' photo.id %}">
        {% csrf_token %}
        <button type="submit" class="delete-button">🗑 Supprimer</button>
      </form>
    </div>
  {% empty %}
    <p>Aucune photo pour ce tournoi.</p>
  {% endfor %}
</div>

<!-- Styles -->
<style>
.section-title {
  text-align: center;
  margin-bottom: 2rem;
  font-size: 2rem;
  color: #333;
}

.upload-button {
  padding: 10px 20px;
  background-color: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  cursor: pointer;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
}

.gallery-item {
  background-color: #f9f9f9;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.gallery-item img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 8px;
}

.caption {
  font-size: 0.9rem;
  margin-bottom: 6px;
}

.delete-button {
  background-color: #dc3545;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}
</style>

{% endblock %}
